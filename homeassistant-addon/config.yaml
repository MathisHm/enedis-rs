name: "Enedis Linky Gateway"
slug: "enedis_linky"
description: "Passerelle Enedis Data-Connect & SGE haute performance avec Auto-Discovery MQTT et intégration Home Assistant Energy"
version: "0.1.0"
arch:
  - aarch64
  - amd64
  - armv7
  - armhf
startup: services
boot: auto
init: false
homeassistant: "2023.1.0"
panel_icon: "mdi:transmission-tower"
panel_title: "Enedis Gateway"
ingress: true
ingress_port: 8080
ports:
  8080/tcp: 8080
map:
  - share:rw
  - config:rw
  - ssl:ro
schema:
  prm: str
  provider: list(dataconnect|sge|mock)?
  dataconnect_client_id: str?
  dataconnect_client_secret: password?
  sge_cert_pem_path: str?
  sge_key_pem_path: str?
  mqtt_host: str?
  mqtt_port: int?
  mqtt_user: str?
  mqtt_password: password?
  mqtt_prefix: str?
  sync_interval_mins: int?
  enable_web_api: bool?
  api_key: password?
options:
  prm: "01234567890123"
  provider: "dataconnect"
  mqtt_host: "core-mosquitto"
  mqtt_port: 1883
  mqtt_prefix: "enedis"
  sync_interval_mins: 60
  enable_web_api: true
